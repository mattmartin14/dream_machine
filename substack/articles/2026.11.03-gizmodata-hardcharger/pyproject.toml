[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardcharger-aws-demo"
version = "0.1.0"
description = "AWS data platform demonstration using managed Hardcharger"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "adbc-driver-hardcharger",
  "boto3>=1.35",
  "duckdb>=1.4",
  "pyarrow>=18",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
hardcharger-etl = "hardcharger_demo.etl:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hardcharger_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: requires a live AWS and Hardcharger environment"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
